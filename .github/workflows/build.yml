name: Android из фиксированных исходников
on:
  pull_request:
    paths:
      - 'ci/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      source:
        description: Полный SHA или существующий тег School Day
        required: true
        type: string
      expected_sha:
        description: Проверенный SHA тега для режимов prepare и draft
        type: string
      mode:
        description: Тестовый APK, подписанный пакет или черновик
        type: choice
        options: [test, candidate, prepare, draft]
        default: test
permissions:
  contents: read
concurrency:
  group: android-${{ inputs.source || github.ref }}-${{ inputs.mode || 'test' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.CI_ANDROID_SOURCE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Проверить исходный коммит
        id: source
        env:
          SOURCE: ${{ inputs.source || vars.CI_ANDROID_SOURCE }}
          EXPECTED: ${{ inputs.expected_sha }}
          MODE: ${{ inputs.mode || 'test' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$MODE" == prepare || "$MODE" == draft ]]; then test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"; fi
          python3 ci/source.py --platform android --ref "$SOURCE" --expected "$EXPECTED" \
            --mode "$MODE" --directory source > BUILD.json
          cat BUILD.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            source/android/**/*.gradle*
            source/android/gradle/wrapper/gradle-wrapper.properties
            source/Cargo.lock
      - name: Установить SDK, NDK и Rust
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add --toolchain 1.98.1 aarch64-linux-android x86_64-linux-android
      - name: Собрать Rust JNI и запустить тесты
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
          MODE: ${{ inputs.mode || 'test' }}
        run: |
          cd source
          cargo test --locked -p school-day-core -p school-day-android
          cd android
          tasks=( :app:testDebugUnitTest :app:assembleDebug )
          if [[ "$MODE" != test ]]; then tasks+=( :app:assembleRelease ); fi
          ./gradlew --no-daemon "${tasks[@]}"
      - name: Проверить APK и контрольные суммы
        env:
          VERSION: ${{ steps.source.outputs.version }}
          MODE: ${{ inputs.mode || 'test' }}
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir dist
          cp BUILD.json dist/
          apk="dist/school-day-$VERSION-debug.apk"
          cp source/android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          python3 ci/verify_apk.py "$apk" --tools "$tools" --version "$VERSION" --signature debug
          (cd dist && sha256sum -- *.apk BUILD.json > SHA256SUMS && sha256sum -c SHA256SUMS)
          if [[ "$MODE" != test ]]; then
            mkdir unsigned
            cp BUILD.json unsigned/
            apk="unsigned/school-day-$VERSION-unsigned.apk"
            cp source/android/app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
            python3 ci/verify_apk.py "$apk" --tools "$tools" --version "$VERSION" --signature unsigned
            git -C source archive --format=tar.gz --prefix="school-day-$VERSION/" \
              --output="$GITHUB_WORKSPACE/unsigned/school-day-$VERSION-source.tar.gz" HEAD
            (cd unsigned && sha256sum -- *.apk BUILD.json *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: school-day-android-debug-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - if: inputs.mode == 'candidate' || inputs.mode == 'prepare' || inputs.mode == 'draft'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ steps.source.outputs.sha }}
          path: unsigned/
          if-no-files-found: error
          retention-days: 3
  sign:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'prepare' || inputs.mode == 'draft')
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-${{ needs.build.outputs.sha }}
          path: unsigned
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Подписать постоянным ключом и проверить отпечаток
        env:
          SOURCE_TAG: ${{ needs.build.outputs.ref }}
          SOURCE_SHA: ${{ needs.build.outputs.sha }}
          SOURCE_VERSION: ${{ needs.build.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: bash ci/sign.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ needs.build.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: [build, sign]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'draft'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-${{ needs.build.outputs.sha }}
          path: dist
      - name: Подготовить черновик релиза Android
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.ref }}
          SHA: ${{ needs.build.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          printf 'Исходный коммит sqeezy-53/school-day@%s\n' "$SHA" > release-notes.txt
          gh release create "$TAG" "school-day-$VERSION-android.apk" \
            "school-day-$VERSION-source.tar.gz" SHA256SUMS BUILD.json CERTIFICATE.txt \
            --draft --target "$GITHUB_SHA" --title "Школьный день Android $VERSION" --notes-file release-notes.txt
